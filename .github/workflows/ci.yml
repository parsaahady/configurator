name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  quality-and-tests:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies from lockfile
        run: uv sync --locked --dev

      - name: Verify code formatting (ruff format)
        run: uv run ruff format --check .

      - name: Run static linter (ruff check)
        run: uv run ruff check .

      - name: Run static type checker (ty)
        run: uv run ty check

      - name: Run unit tests with >=80% branch coverage (pytest)
        run: uv run pytest
